<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex Dic: Türkçe 🇹🇷</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Vazirmatn:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #04000c;
      --bg2:      #0a0020;
      --bg3:      #10002e;
      --purple:   #c44fff;
      --purple2:  #8800ee;
      --cyan:     #00e5ff;
      --pink:     #ff2d9b;
      --green:    #39ff14;
      --pdim:     rgba(196,79,255,0.22);
      --cdim:     rgba(0,229,255,0.22);
      --pndim:    rgba(255,45,155,0.22);
      --text:     #f0e8ff;
      --muted:    #9080b8;
      --cardbg:   rgba(196,79,255,0.035);
      --cardbord: rgba(196,79,255,0.16);
    }

    * { box-sizing: border-box; margin:0; padding:0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* neon grid */
    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(196,79,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(196,79,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events:none; z-index:0;
    }

    /* ambient glow orbs */
    .orb {
      position:fixed;
      border-radius:50%;
      pointer-events:none;
      z-index:0;
      filter:blur(80px);
      opacity:0.18;
    }
    .orb1 { width:500px;height:340px; background:var(--purple); top:-100px; left:50%; transform:translateX(-50%); }
    .orb2 { width:300px;height:300px; background:var(--cyan);   bottom:10%; right:-80px; }
    .orb3 { width:250px;height:250px; background:var(--pink);   bottom:30%; left:-60px; }

    /* ─── LOADING BAR ─── */
    #loadTrack {
      position:fixed; top:0; left:0; right:0; height:3px;
      background:rgba(196,79,255,0.08); z-index:9999;
      opacity:0; transition:opacity .3s;
    }
    #loadBar {
      height:100%; width:0%;
      background: linear-gradient(90deg, var(--purple2), var(--purple), var(--cyan), var(--pink));
      box-shadow: 0 0 14px var(--purple), 0 0 28px var(--cyan);
      transition: width .35s cubic-bezier(.4,0,.2,1);
      position:relative; overflow:hidden;
    }
    #loadBar::after {
      content:'';
      position:absolute; top:0; right:0;
      width:60px; height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9));
      animation: shimmer 1s linear infinite;
    }
    @keyframes shimmer { 0%{opacity:1} 50%{opacity:0.3} 100%{opacity:1} }

    /* ─── FLOATING LANG TOGGLE ─── */
    #langBtn {
      position:fixed; bottom:26px; right:22px; z-index:1000;
      border:1px solid var(--cyan);
      background:rgba(0,10,30,0.82);
      color:var(--cyan);
      padding:10px 20px;
      border-radius:40px;
      cursor:pointer;
      font-family:'IBM Plex Mono', monospace;
      font-size:0.76rem; font-weight:700;
      letter-spacing:0.14em;
      display:flex; align-items:center; gap:8px;
      backdrop-filter:blur(14px);
      box-shadow: 0 0 22px rgba(0,229,255,0.3), 0 4px 24px rgba(0,0,0,0.6);
      text-shadow: 0 0 10px var(--cyan);
      transition:all .22s;
      animation: pulse-btn 3s ease-in-out infinite;
    }
    #langBtn:hover {
      background:rgba(0,229,255,0.1);
      box-shadow: 0 0 36px rgba(0,229,255,0.5), 0 4px 30px rgba(0,0,0,0.7);
      transform:translateY(-3px) scale(1.03);
      animation:none;
    }
    @keyframes pulse-btn {
      0%,100% { box-shadow: 0 0 22px rgba(0,229,255,0.3), 0 4px 24px rgba(0,0,0,0.6); }
      50%      { box-shadow: 0 0 36px rgba(0,229,255,0.55), 0 4px 30px rgba(0,0,0,0.7); }
    }

    /* ─── PAGE ─── */
    .page {
      position:relative; z-index:1;
      max-width:920px; margin:0 auto;
      padding:44px 20px 140px;
    }

    /* ─── HEADER ─── */
    header { text-align:center; margin-bottom:44px; }

    .logo {
      font-family:'Orbitron', monospace;
      font-size: clamp(1.5rem, 5.5vw, 3rem);
      font-weight:900;
      letter-spacing:0.04em;
      background: linear-gradient(120deg, var(--purple), var(--cyan) 50%, var(--pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter: drop-shadow(0 0 22px rgba(196,79,255,0.6));
      margin-bottom:12px;
    }
    .logo-flag { -webkit-text-fill-color:initial; filter:none; }

    .hline {
      width:220px; height:1px; margin:14px auto;
      background:linear-gradient(90deg, transparent, var(--purple), var(--cyan), transparent);
      box-shadow: 0 0 10px var(--purple);
    }

    .subtitle {
      font-family:'IBM Plex Mono', monospace;
      font-size:0.75rem; letter-spacing:0.18em;
      color:var(--muted); text-transform:uppercase;
    }

    /* ─── SEARCH ─── */
    .search-wrap {
      display:flex; align-items:stretch;
      border:1px solid var(--pdim); border-radius:8px; overflow:hidden;
      background:var(--bg2);
      transition:border-color .2s, box-shadow .2s;
      box-shadow: 0 0 24px rgba(196,79,255,0.07), inset 0 1px 0 rgba(196,79,255,0.06);
    }
    .search-wrap:focus-within {
      border-color:var(--purple);
      box-shadow: 0 0 40px rgba(196,79,255,0.22), 0 0 70px rgba(0,229,255,0.06), inset 0 1px 0 rgba(196,79,255,0.12);
    }

    .tr-badge {
      display:flex; align-items:center; padding:0 18px;
      background:linear-gradient(135deg, rgba(196,79,255,0.14), rgba(0,229,255,0.07));
      border-right:1px solid var(--pdim);
      font-family:'IBM Plex Mono', monospace;
      font-size:0.7rem; letter-spacing:0.16em;
      color:var(--cyan); text-shadow:0 0 10px var(--cyan);
    }

    #wordInput {
      flex:1; border:none; outline:none;
      padding:18px 20px;
      font-family:'Exo 2', sans-serif; font-size:1.35rem; font-weight:600;
      color:var(--text); background:transparent; caret-color:var(--cyan);
    }
    #wordInput::placeholder { color:var(--muted); font-weight:300; font-style:italic; }

    #searchBtn {
      border:none;
      background:linear-gradient(135deg, var(--purple2), var(--purple));
      color:#fff; padding:0 28px; cursor:pointer;
      font-family:'IBM Plex Mono', monospace;
      font-size:0.76rem; font-weight:700; letter-spacing:0.1em;
      transition:all .2s; white-space:nowrap;
      text-shadow:0 0 12px rgba(255,255,255,0.5);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
    }
    #searchBtn:hover {
      background:linear-gradient(135deg, var(--purple), #dd77ff);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 0 24px rgba(196,79,255,0.5);
    }
    #searchBtn:disabled { background:rgba(80,60,110,0.4); cursor:not-allowed; text-shadow:none; }

    /* ─── RESULTS ─── */
    #results { margin-top:38px; }

    .r-animate { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* WORD HEADER */
    .word-header {
      padding:24px 26px; margin-bottom:28px;
      background:linear-gradient(135deg, rgba(196,79,255,0.07), rgba(0,229,255,0.03));
      border:1px solid var(--pdim); border-radius:10px;
      position:relative; overflow:hidden;
    }
    .word-header::before {
      content:''; position:absolute; left:0;top:0;bottom:0; width:4px;
      background:linear-gradient(180deg, var(--purple), var(--cyan), var(--pink));
      box-shadow:0 0 16px var(--purple);
    }

    .wh-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }

    .wh-word {
      font-family:'Orbitron', monospace; font-weight:900;
      font-size:clamp(1.8rem,5vw,2.8rem);
      background:linear-gradient(120deg, #fff 30%, var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 14px rgba(196,79,255,0.6));
    }

    .wh-type {
      font-family:'IBM Plex Mono', monospace; font-size:0.66rem;
      letter-spacing:0.16em; padding:5px 12px; border-radius:20px;
      border:1px solid var(--cyan); color:var(--cyan);
      text-shadow:0 0 8px var(--cyan); box-shadow:0 0 10px rgba(0,229,255,0.2);
    }

    .wh-kok {
      font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
      color:var(--muted); letter-spacing:0.06em;
    }
    .wh-kok em { color:var(--pink); font-style:normal; text-shadow:0 0 8px var(--pink); }

    .wh-meaning {
      font-size:1.05rem; line-height:1.7;
      padding:10px 12px;
      background:rgba(196,79,255,0.04); border-radius:6px;
      border-left:2px solid var(--pdim);
    }
    .wh-meaning.fa { font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right; color:var(--muted); }
    .wh-meaning.en { color:var(--muted); font-style:italic; }

    /* SECTION */
    .sec { margin-bottom:30px; }

    .sec-title {
      font-family:'IBM Plex Mono',monospace;
      font-size:0.66rem; letter-spacing:0.2em;
      color:var(--purple); text-shadow:0 0 10px rgba(196,79,255,0.5);
      margin-bottom:14px;
      display:flex; align-items:center; gap:12px;
    }
    .sec-title::after {
      content:''; flex:1; height:1px;
      background:linear-gradient(90deg, var(--pdim), transparent);
    }

    /* FORM CARDS */
    .fgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }

    .fcard {
      background:var(--cardbg); border:1px solid var(--cardbord);
      border-radius:8px; padding:16px 18px;
      transition:all .2s; position:relative; overflow:hidden;
    }
    .fcard::before {
      content:''; position:absolute; left:0;top:0;bottom:0; width:2px;
      background:linear-gradient(180deg, var(--purple), var(--cyan));
      opacity:0; transition:opacity .2s; box-shadow:0 0 8px var(--purple);
    }
    .fcard:hover { background:rgba(196,79,255,0.07); border-color:rgba(196,79,255,0.4); transform:translateY(-2px); box-shadow:0 6px 24px rgba(196,79,255,0.1); }
    .fcard:hover::before { opacity:1; }

    .fc-lbl {
      display:flex; align-items:center; gap:6px; flex-wrap:wrap;
      margin-bottom:9px;
    }
    .fc-lbl-fa  { font-family:'Vazirmatn',sans-serif; font-size:0.72rem; color:var(--cyan); }
    .fc-lbl-en  { font-family:'IBM Plex Mono',monospace; font-size:0.6rem; letter-spacing:0.08em; color:var(--cyan); }
    .fc-lbl-tr  { font-family:'IBM Plex Mono',monospace; font-size:0.55rem; color:rgba(196,79,255,0.4); letter-spacing:0.08em; }

    .fc-form {
      font-family:'Exo 2',sans-serif; font-size:1.28rem; font-weight:700;
      color:#fff; margin-bottom:9px;
      text-shadow:0 0 8px rgba(255,255,255,0.15);
    }
    .suf { color:var(--pink); text-shadow:0 0 12px var(--pink); }

    .fc-note { font-size:0.84rem; line-height:1.6; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid rgba(196,79,255,0.08); }
    .fc-note.fa { font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right; color:var(--muted); }
    .fc-note.en { color:var(--muted); font-style:italic; }

    .fc-ex-tr   { font-weight:600; font-size:0.88rem; color:var(--cyan); margin-bottom:3px; text-shadow:0 0 6px rgba(0,229,255,0.3); }
    .fc-ex-t    { font-size:0.8rem; }
    .fc-ex-t.fa { font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right; color:var(--muted); }
    .fc-ex-t.en { color:var(--muted); font-style:italic; }

    /* VERB TENSE BLOCK */
    .tblock {
      background:var(--cardbg); border:1px solid var(--cardbord);
      border-radius:10px; padding:20px; margin-bottom:12px;
      transition:all .2s;
    }
    .tblock:hover { border-color:rgba(196,79,255,0.32); box-shadow:0 4px 28px rgba(196,79,255,0.08); }

    .tb-head { display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px; }

    .tb-name { font-family:'Exo 2',sans-serif; font-weight:700; font-size:1rem; color:var(--purple); text-shadow:0 0 8px rgba(196,79,255,0.4); }
    .tb-sub   { font-size:0.78rem; font-weight:400; margin-top:3px; }
    .tb-sub.fa { font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right; color:var(--muted); }
    .tb-sub.en { color:var(--muted); font-style:italic; }

    .tb-note { font-size:0.82rem; line-height:1.55; max-width:380px; }
    .tb-note.fa { font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right; color:var(--muted); }
    .tb-note.en { color:var(--muted); font-style:italic; }

    .ctable { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:14px; }
    @media(max-width:480px){ .ctable { grid-template-columns:repeat(2,1fr); } }

    .ccell {
      background:rgba(196,79,255,0.05); border:1px solid rgba(196,79,255,0.1);
      border-radius:5px; padding:9px 12px;
    }
    .cc-p { font-family:'IBM Plex Mono',monospace; font-size:0.58rem; color:var(--muted); letter-spacing:0.1em; margin-bottom:3px; }
    .cc-f { font-weight:700; font-size:0.95rem; color:#fff; }

    .tb-ex {
      background:rgba(0,229,255,0.04); border-left:2px solid var(--cyan);
      border-radius:0 5px 5px 0; padding:11px 15px;
    }
    .tb-ex-tr { font-weight:600; font-size:0.9rem; color:var(--cyan); margin-bottom:4px; text-shadow:0 0 6px rgba(0,229,255,0.3); }
    .tb-ex-t   { font-size:0.8rem; }
    .tb-ex-t.fa { font-family:'Vazirmatn',sans-serif; direction:rtl; text-align:right; color:var(--muted); }
    .tb-ex-t.en { color:var(--muted); font-style:italic; }

    /* LOADING */
    .l-state { text-align:center; padding:80px 0; }
    .l-dots { display:flex; justify-content:center; gap:10px; margin-bottom:24px; }
    .l-dot  { width:12px;height:12px; border-radius:50%; animation:dpulse 1.4s ease-in-out infinite both; }
    .l-dot:nth-child(1){ background:var(--purple); box-shadow:0 0 12px var(--purple); animation-delay:0s; }
    .l-dot:nth-child(2){ background:var(--cyan);   box-shadow:0 0 12px var(--cyan);   animation-delay:.18s; }
    .l-dot:nth-child(3){ background:var(--pink);   box-shadow:0 0 12px var(--pink);   animation-delay:.36s; }
    @keyframes dpulse { 0%,80%,100%{transform:scale(.55);opacity:.3} 40%{transform:scale(1.2);opacity:1} }
    .l-text { font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--muted); letter-spacing:0.1em; }

    .err-box {
      background:rgba(255,45,155,0.06); border:1px solid rgba(255,45,155,0.3);
      border-left:3px solid var(--pink); padding:18px 20px; border-radius:8px;
      color:#ff99cc; font-size:0.95rem; box-shadow:0 0 24px rgba(255,45,155,0.08);
    }

    /* ─── LANG SWITCH ─── */
    body.lfa .shen { display:none !important; }
    body.len .shfa { display:none !important; }

    footer {
      margin-top:80px; text-align:center;
      font-family:'IBM Plex Mono',monospace; font-size:0.68rem;
      color:var(--muted); letter-spacing:0.12em; opacity:.5;
    }
  </style>
</head>
<body class="lfa">

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- LOADING BAR -->
<div id="loadTrack"><div id="loadBar"></div></div>

<!-- FLOATING LANG BUTTON -->
<button id="langBtn" onclick="toggleLang()">
  <span>🌐</span>
  <span id="langLabel">English</span>
</button>

<div class="page">

  <header>
    <div class="logo">APEX DIC: Türkçe <span class="logo-flag">🇹🇷</span></div>
    <div class="hline"></div>
    <div class="subtitle">Turkish Morphology &amp; Declension Dictionary</div>
  </header>

  <div class="search-wrap">
    <div class="tr-badge">TR</div>
    <input type="text" id="wordInput" placeholder="Bir kelime yazın… (ör: elma, gitmek)" autocomplete="off" spellcheck="false"/>
    <button id="searchBtn" onclick="analyze()">SEARCH →</button>
  </div>

  <div id="results"></div>

  <footer>APEX DIC · AI-POWERED TURKISH MORPHOLOGY DICTIONARY</footer>
</div>

<script>
// ─── LANG ───
let lang = 'fa';
function toggleLang(){
  lang = lang==='fa'?'en':'fa';
  document.body.classList.toggle('lfa', lang==='fa');
  document.body.classList.toggle('len', lang==='en');
  document.getElementById('langLabel').textContent = lang==='fa'?'English':'Persian';
}

// ─── LOADING BAR ───
const track=document.getElementById('loadTrack'), bar=document.getElementById('loadBar');
let lid=null, lp=0;
function startLoad(){
  lp=0; bar.style.transition='none'; bar.style.width='0%';
  track.style.opacity='1'; void bar.offsetWidth;
  bar.style.transition='width .4s cubic-bezier(.4,0,.2,1)';
  lid=setInterval(()=>{
    lp += lp<65 ? Math.random()*10+4 : lp<88 ? Math.random()*2+.5 : 0;
    lp=Math.min(lp,90); bar.style.width=lp+'%';
  },280);
}
function doneLoad(){
  clearInterval(lid);
  bar.style.transition='width .28s ease';
  bar.style.width='100%';
  setTimeout(()=>{ track.style.opacity='0'; setTimeout(()=>{bar.style.width='0%';},400); },380);
}

// ─── SAFE HTML ───
function esc(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

// ─── SEARCH ELEMENTS ───
const inp=document.getElementById('wordInput'), btn=document.getElementById('searchBtn'), res=document.getElementById('results');
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') analyze(); });

// ─── FREE ONLINE + LOCAL FALLBACK ENGINE ───
// The UI above stays untouched. Everything below only replaces the broken API/search engine.
const CACHE_KEY='apex-dic-online-cache-v3';
let ONLINE_CACHE={};
try{ ONLINE_CACHE=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}') || {}; }catch(_){ ONLINE_CACHE={}; }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify(ONLINE_CACHE)); }catch(_){} }

const LOCAL_LEXICON={
  bebek:{tur:'isim',fa:'نوزاد / کودک خردسال',en:'baby / infant',cat:'person'},
  çocuk:{tur:'isim',fa:'کودک',en:'child',cat:'person'}, cocuk:{tur:'isim',fa:'کودک',en:'child',cat:'person'},
  adam:{tur:'isim',fa:'مرد',en:'man',cat:'person'}, kadın:{tur:'isim',fa:'زن',en:'woman',cat:'person'}, kadin:{tur:'isim',fa:'زن',en:'woman',cat:'person'},
  insan:{tur:'isim',fa:'انسان',en:'human',cat:'person'}, öğrenci:{tur:'isim',fa:'دانش‌آموز / دانشجو',en:'student',cat:'person'}, ogrenci:{tur:'isim',fa:'دانش‌آموز / دانشجو',en:'student',cat:'person'},
  kedi:{tur:'isim',fa:'گربه',en:'cat',cat:'animal'}, köpek:{tur:'isim',fa:'سگ',en:'dog',cat:'animal'}, kopek:{tur:'isim',fa:'سگ',en:'dog',cat:'animal'}, kuş:{tur:'isim',fa:'پرنده',en:'bird',cat:'animal'}, kus:{tur:'isim',fa:'پرنده',en:'bird',cat:'animal'},
  kitap:{tur:'isim',fa:'کتاب',en:'book',cat:'text'}, defter:{tur:'isim',fa:'دفتر',en:'notebook',cat:'text'}, sözlük:{tur:'isim',fa:'فرهنگ لغت / دیکشنری',en:'dictionary',cat:'text'}, sozluk:{tur:'isim',fa:'فرهنگ لغت / دیکشنری',en:'dictionary',cat:'text'},

function hl(form,root){
  form=String(form||''); root=String(root||'');
  if(!form) return '';
  if(!root) return esc(form);
  const low=lowerTR(form), rlow=lowerTR(root), soft=lowerTR(stemForVowelSuffix(root)), vsoft=lowerTR(verbStemForVowelSuffix(root));
  let end=-1;
  if(low.startsWith(rlow)) end=root.length;
  else if(soft && low.startsWith(soft)) end=chars(stemForVowelSuffix(root)).length;
  else if(vsoft && low.startsWith(vsoft)) end=chars(verbStemForVowelSuffix(root)).length;
  else {
    const idx=low.indexOf(rlow);
    if(idx>=0) end=idx+root.length;
  }
  if(end<0) return esc(form);
  return esc(form.slice(0,end))+`<span class="suf">${esc(form.slice(end))}</span>`;
}

async function fetchJSON(url,timeout=3500){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const r=await fetch(url,{signal:ctrl.signal,headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{ clearTimeout(to); }
}
function cleanTranslation(txt,src){
  txt=String(txt||'').trim();

  if(bad.some(b=>txt.toUpperCase().includes(b))) return '';
  if(lowerTR(txt)===lowerTR(src)) return '';
  if(/^\[object Object\]$/i.test(txt)) return '';
  return txt.replace(/^"|"$/g,'').trim();
}
async function translateFree(text,target){

  let fa='', en='';
  try{
    const pair=await Promise.allSettled([translateFree(lookupText,'fa'),translateFree(lookupText,'en')]);
    fa=pair[0].status==='fulfilled'?pair[0].value:'';
    en=pair[1].status==='fulfilled'?pair[1].value:'';
  }catch(_){}

  if(!fa || !en){
    const wd=await wikidataFallback(lookupText);

  const mastar=stem+'m'+a+'k', neg=stem+'m'+a, aor=aoristBase(stem), pres=presentContinuous(stem), past=pastBase(stem), fut=futureBase(stem);
  const temel=[
    {ad:'Mastar',ad_fa:'مصدر',ad_en:'Infinitive',form:mastar,note_fa:'مصدر شکل پایه فعل است و در ترکی معمولاً با پسوند -mak یا -mek ساخته می‌شود.',note_en:'The infinitive is the basic verb form and is usually built with -mak or -mek.',ex_tr:`${capTR(mastar)} istiyorum.`,ex_fa:`می‌خواهم ${faP.inf}.`,ex_en:`I want to ${enP.base}.`},
    {ad:'Olumsuz',ad_fa:'منفی',ad_en:'Negative',form:neg,note_fa:'برای منفی کردن ریشه فعل، پسوند -ma یا -me به ریشه اضافه می‌شود.',note_en:'The negative verb stem is built by adding -ma or -me to the root.',ex_tr:`Bugün ${neg} formunu öğreniyoruz.`,ex_fa:`امروز شکل منفی فعل «${gfa}» را یاد می‌گیریم.`,ex_en:`Today we learn the negative form of “${gen}”.`},
    {ad:'Soru',ad_fa:'سؤالی',ad_en:'Question',form:aor+' '+questionParticle(aor)+'?',note_fa:'برای سؤال ساختن، ذره پرسشی mı/mi/mu/mü بعد از شکل صرف‌شده می‌آید.',note_en:'To form a question, the particle mı/mi/mu/mü is placed after the conjugated form.',ex_tr:`O ${aor} ${questionParticle(aor)}?`,ex_fa:`آیا او ${faP.aor.replace(/^می‌/,'')}؟`,ex_en:`Does he or she ${enP.base}?`}
  ];
  const zamanlar=[
    {ad:'Geniş Zaman',ad_fa:'زمان حال اخباری / عادت',ad_en:'Aorist — Habitual Present',note_fa:'برای عادت‌های روزمره، حقایق کلی و کارهایی که معمولاً انجام می‌شوند استفاده می‌شود.',note_en:'Used for habits, general truths, and actions that usually happen.',ex_tr:`Ben her gün ${personSetAorist(aor)[0].f}.`,ex_fa:`من هر روز ${faP.aor}.`,ex_en:`I ${enP.aor} every day.`,sahislar:personSetAorist(aor)},
    {ad:'Şimdiki Zaman',ad_fa:'زمان حال در جریان',ad_en:'Present Continuous',note_fa:'برای کاری استفاده می‌شود که همین حالا یا در همین دوره در جریان است.',note_en:'Used for an action happening right now or around the present time.',ex_tr:`Ben şimdi ${personSetPresent(pres)[0].f}.`,ex_fa:`من الان ${faP.pres}.`,ex_en:`I ${enP.pres} now.`,sahislar:personSetPresent(pres)},
    {ad:'Geçmiş Zaman (-di)',ad_fa:'زمان گذشته قطعی (شاهد عینی)',ad_en:'Definite Past (Witnessed)',note_fa:'برای کاری استفاده می‌شود که در گذشته اتفاق افتاده و گوینده آن را قطعی بیان می‌کند.',note_en:'Used for an event that happened in the past and is stated as definite.',ex_tr:`Dün ${personSetPast(past)[0].f}.`,ex_fa:`دیروز ${faP.past}.`,ex_en:`I ${enP.past} yesterday.`,sahislar:personSetPast(past)},
    {ad:'Gelecek Zaman',ad_fa:'زمان آینده',ad_en:'Future Tense',note_fa:'برای کاری استفاده می‌شود که در آینده انجام خواهد شد.',note_en:'Used for an action that will happen in the future.',ex_tr:`Yarın ${personSetFuture(fut)[0].f}.`,ex_fa:`فردا ${faP.fut}.`,ex_en:`I ${enP.fut} tomorrow.`,sahislar:personSetFuture(fut)},
    {ad:'Emir Kipi',ad_fa:'وجه امری / دستوری',ad_en:'Imperative Mood',note_fa:'برای دستور، درخواست یا پیشنهاد استفاده می‌شود؛ شکل دوم شخص مفرد معمولاً خود ریشه فعل است.',note_en:'Used for commands, requests, and suggestions; the second-person singular is usually the bare root.',ex_tr:`Lütfen ${personSetImperative(stem)[0].f}.`,ex_fa:`لطفاً ${faP.imp}.`,ex_en:`Please ${enP.imp}.`,sahislar:personSetImperative(stem)}
  ];
  const turevler=[
    makeDerivative(stem+'m'+a+'l'+i,`این ساخت معنی «باید ${gfa}» یا ضرورت انجام کار را می‌دهد.`,`This form expresses necessity: “must/should ${gen}”.`,`Bunu ${stem+'m'+a+'l'+i}.`,`باید این کار انجام شود.`,`This should be done.`),
    makeDerivative(stem+'m'+a+'k için',`این ساخت هدف را نشان می‌دهد: «برای ${gfa}».`,`This form expresses purpose: “in order to ${gen}”.`,`${capTR(stem+'m'+a+'k')} için zaman lazım.`,`برای ${gfa} زمان لازم است.`,`Time is needed in order to ${gen}.`)
  ];
  return {kelime:raw,tur:'fiil',anlam_fa:lex.fa,anlam_en:lex.en,kok:stem,sesUyumu:aType(stem),isimse:null,fiilse:{temel,zamanlar},turevler};
}

async function buildAnalysis(raw){
  const isVerb=detectVerb(raw);
  const stem=isVerb ? getVerbStem(raw) : raw;
  const lex=await resolveMeaning(raw,stem,isVerb);
  if(isArabicScript(raw)) return buildArabicNounAnalysis(raw,lex);
  return isVerb ? buildVerbAnalysis(raw,lex) : buildLatinNounAnalysis(raw,lex);
}

async function analyze(){
  const w=safeInput(inp.value.trim()); if(!w) return;
  btn.disabled=true; btn.textContent='...';
  startLoad();
  res.innerHTML=`<div class="l-state"><div class="l-dots"><div class="l-dot"></div><div class="l-dot"></div><div class="l-dot"></div></div><div class="l-text">ANALYZING "${esc(w.toUpperCase())}"…</div></div>`;

  try{
    const parsed=await buildAnalysis(w);
    doneLoad();
    render(parsed);
  }catch(err){
    doneLoad();
    res.innerHTML=`<div class="err-box">⚠️ خطا / Error: ${esc(err.message)}<br><small>موتور داخلی فعال است؛ لطفاً دوباره تلاش کنید / Please try again.</small></div>`;
  }
  btn.disabled=false; btn.textContent='SEARCH →';
}

// ─── RENDER ───
function render(d){
  const base=d.kok||d.kelime;
  let h=`<div class="r-animate">`;

  h+=`<div class="word-header">
    <div class="wh-top">
      <span class="wh-word">${esc(d.kelime)}</span>
      <span class="wh-type">${esc((d.tur||'').toUpperCase())}</span>
      ${d.kok?`<span class="wh-kok">kök: <em>${esc(d.kok)}</em>${d.sesUyumu?' · '+esc(d.sesUyumu):''}</span>`:''}
    </div>
    <div class="wh-meaning fa shfa">${esc(d.anlam_fa||'')}</div>
    <div class="wh-meaning en shen">${esc(d.anlam_en||'')}</div>
  </div>`;

  if(d.isimse){
    const renderCases=(arr,tfa,ten)=>{
      if(!arr?.length) return '';
      return `<div class="sec">
        <div class="sec-title"><span class="shfa">${esc(tfa)}</span><span class="shen">${esc(ten)}</span></div>
        <div class="fgrid">
          ${arr.map(c=>`
            <div class="fcard">
              <div class="fc-lbl">
                <span class="shfa fc-lbl-fa">${esc(c.hal_fa||c.sahip_fa||'')}</span>
                <span class="shen fc-lbl-en">${esc(c.hal_en||c.sahip_en||'')}</span>
                <span class="fc-lbl-tr">${esc(c.hal||c.sahip||'')}</span>
              </div>
              <div class="fc-form">${hl(c.form,base)}</div>
              <div class="fc-note fa shfa">${esc(c.note_fa||'')}</div>
              <div class="fc-note en shen">${esc(c.note_en||'')}</div>
              <div class="fc-ex-tr">${esc(c.ex_tr||'')}</div>
              <div class="fc-ex-t fa shfa">${esc(c.ex_fa||'')}</div>
              <div class="fc-ex-t en shen">${esc(c.ex_en||'')}</div>
            </div>`).join('')}
        </div>
      </div>`;
    };
    h+=renderCases(d.isimse.tekil, 'حالت‌های مفرد (صرف اسم)', 'Singular Cases — Noun Declension');
    h+=renderCases(d.isimse.coul,  'حالت‌های جمع', 'Plural Cases');
    h+=renderCases(d.isimse.iyelik,'پسوندهای ملکی (صاحب)', 'Possessive Suffixes');
  }

  if(d.fiilse){
    const f=d.fiilse;
    if(f.temel?.length){
      h+=`<div class="sec">
        <div class="sec-title"><span class="shfa">فرم‌های پایه فعل</span><span class="shen">Base Verb Forms</span></div>
        <div class="fgrid">
          ${f.temel.map(t=>`
            <div class="fcard">
              <div class="fc-lbl">
                <span class="shfa fc-lbl-fa">${esc(t.ad_fa)}</span>
                <span class="shen fc-lbl-en">${esc(t.ad_en)}</span>
                <span class="fc-lbl-tr">${esc(t.ad)}</span>
              </div>
              <div class="fc-form">${hl(t.form,base)}</div>
              <div class="fc-note fa shfa">${esc(t.note_fa)}</div>
              <div class="fc-note en shen">${esc(t.note_en)}</div>
              <div class="fc-ex-tr">${esc(t.ex_tr)}</div>
              <div class="fc-ex-t fa shfa">${esc(t.ex_fa)}</div>
              <div class="fc-ex-t en shen">${esc(t.ex_en)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }
    if(f.zamanlar?.length){
      h+=`<div class="sec">
        <div class="sec-title"><span class="shfa">زمان‌ها و صرف فعل</span><span class="shen">Tenses & Conjugation</span></div>
        ${f.zamanlar.map(z=>`
          <div class="tblock">
            <div class="tb-head">
              <div>
                <div class="tb-name">${esc(z.ad)}</div>
                <div class="tb-sub fa shfa">${esc(z.ad_fa)}</div>
                <div class="tb-sub en shen">${esc(z.ad_en)}</div>
              </div>
              <div>
                <div class="tb-note fa shfa">${esc(z.note_fa)}</div>
                <div class="tb-note en shen">${esc(z.note_en)}</div>
              </div>
            </div>
            <div class="ctable">
              ${(z.sahislar||[]).map(s=>`
                <div class="ccell">
                  <div class="cc-p">${esc(s.s)}</div>
                  <div class="cc-f">${hl(s.f,base)}</div>
                </div>`).join('')}
            </div>
            <div class="tb-ex">
              <div class="tb-ex-tr">${esc(z.ex_tr||'')}</div>
              <div class="tb-ex-t fa shfa">${esc(z.ex_fa||'')}</div>
              <div class="tb-ex-t en shen">${esc(z.ex_en||'')}</div>
            </div>
          </div>`).join('')}
      </div>`;
    }
  }

  if(d.turevler?.length){
    h+=`<div class="sec">
      <div class="sec-title"><span class="shfa">مشتقات و ساختارهای مرتبط</span><span class="shen">Derivatives & Related Forms</span></div>
      <div class="fgrid">
        ${d.turevler.map(t=>`
          <div class="fcard">
            <div class="fc-form" style="margin-bottom:8px">${hl(t.form,base)}</div>
            <div class="fc-note fa shfa">${esc(t.note_fa)}</div>
            <div class="fc-note en shen">${esc(t.note_en)}</div>
            <div class="fc-ex-tr">${esc(t.ex_tr||'')}</div>
            <div class="fc-ex-t fa shfa">${esc(t.ex_fa||'')}</div>
            <div class="fc-ex-t en shen">${esc(t.ex_en||'')}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  h+=`</div>`;
  res.innerHTML=h;
  res.scrollIntoView({behavior:'smooth',block:'start'});
}
