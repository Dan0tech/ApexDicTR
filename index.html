  <meta name="theme-color" content="#0a0020"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Vazirmatn:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #04000c;
      --bg2:      #0a0020;
      --bg3:      #10002e;
      --purple:   #c44fff;
      --purple2:  #8800ee;
      --cyan:     #00e5ff;
      --sky:      #7ddcff;
      --sky2:     #38c9ff;
      --pink:     #ff2d9b;
      --green:    #39ff14;
      --pdim:     rgba(196,79,255,0.22);
      --cdim:     rgba(0,229,255,0.22);
      --pndim:    rgba(255,45,155,0.22);
      --text:     #f0e8ff;
      --muted:    #9080b8;
      --cardbg:   rgba(196,79,255,0.035);
      --cardbord: rgba(196,79,255,0.16);
    }

    * { box-sizing: border-box; margin:0; padding:0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* neon grid */
    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(196,79,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(196,79,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events:none; z-index:0;
    }

    /* ambient glow orbs */
    .orb {
      position:fixed;
      border-radius:50%;
      pointer-events:none;
      z-index:0;
      filter:blur(80px);
      opacity:0.18;
    }
    .orb1 { width:500px;height:340px; background:var(--purple); top:-100px; left:50%; transform:translateX(-50%); }
    .orb2 { width:300px;height:300px; background:var(--cyan);   bottom:10%; right:-80px; }
    .orb3 { width:250px;height:250px; background:var(--pink);   bottom:30%; left:-60px; }

    /* ─── LOADING BAR ─── */
    #loadTrack {
      position:fixed; top:0; left:0; right:0; height:3px;
      background:rgba(196,79,255,0.08); z-index:9999;
      opacity:0; transition:opacity .3s;
    }
    #loadBar {
      height:100%; width:0%;
      background: linear-gradient(90deg, var(--purple2), var(--purple), var(--cyan), var(--pink));
      box-shadow: 0 0 14px var(--purple), 0 0 28px var(--cyan);
      transition: width .35s cubic-bezier(.4,0,.2,1);
      position:relative; overflow:hidden;
    }
    #loadBar::after {
      content:'';
      position:absolute; top:0; right:0;
      width:60px; height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9));
      animation: shimmer 1s linear infinite;
    }
    @keyframes shimmer { 0%{opacity:1} 50%{opacity:0.3} 100%{opacity:1} }

    /* ─── FLOATING LANG TOGGLE ─── */
    #langBtn {
      position:fixed; bottom:26px; right:22px; z-index:1000;
      border:1px solid var(--cyan);
      background:rgba(0,10,30,0.82);
      color:var(--cyan);
      padding:10px 20px;
      border-radius:40px;
      cursor:pointer;
      font-family:'IBM Plex Mono', monospace;
      font-size:0.76rem; font-weight:700;
      letter-spacing:0.14em;
      display:flex; align-items:center; gap:8px;
      backdrop-filter:blur(14px);
      box-shadow: 0 0 22px rgba(0,229,255,0.3), 0 4px 24px rgba(0,0,0,0.6);
      text-shadow: 0 0 10px var(--cyan);
      transition:all .22s;
      animation: pulse-btn 3s ease-in-out infinite;
    }
    #langBtn:hover {
      background:rgba(0,229,255,0.1);
      box-shadow: 0 0 36px rgba(0,229,255,0.5), 0 4px 30px rgba(0,0,0,0.7);
      transform:translateY(-3px) scale(1.03);
      animation:none;
    }
    @keyframes pulse-btn {
      0%,100% { box-shadow: 0 0 22px rgba(0,229,255,0.3), 0 4px 24px rgba(0,0,0,0.6); }
      50%      { box-shadow: 0 0 36px rgba(0,229,255,0.55), 0 4px 30px rgba(0,0,0,0.7); }
    }

    /* ─── PAGE ─── */
    .page {
      position:relative; z-index:1;
      max-width:920px; margin:0 auto;
      padding:44px 20px 140px;
    }

    /* ─── HEADER ─── */
    header { text-align:center; margin-bottom:44px; }

    .logo {
      font-family:'Orbitron', monospace;
      font-size: clamp(1.5rem, 5.5vw, 3rem);
      font-weight:900;
      letter-spacing:0.04em;
      background: linear-gradient(120deg, var(--purple), var(--cyan) 50%, var(--pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter: drop-shadow(0 0 22px rgba(196,79,255,0.6));
      margin-bottom:12px;
    }
    .logo-flag { -webkit-text-fill-color:initial; filter:none; }

    .hline {
      width:220px; height:1px; margin:14px auto;
      background:linear-gradient(90deg, transparent, var(--purple), var(--cyan), transparent);
      box-shadow: 0 0 10px var(--purple);
    }

    .subtitle {
      font-family:'IBM Plex Mono', monospace;
      font-size:0.75rem; letter-spacing:0.18em;
      color:var(--muted); text-transform:uppercase;
    }

    /* ─── SEARCH ─── */
    .search-wrap {
      display:flex; align-items:stretch;
      border:1px solid var(--pdim); border-radius:8px; overflow:hidden;
      background:var(--bg2);
      transition:border-color .2s, box-shadow .2s;
      box-shadow: 0 0 24px rgba(196,79,255,0.07), inset 0 1px 0 rgba(196,79,255,0.06);
    }
    .search-wrap:focus-within {
      border-color:var(--purple);
      box-shadow: 0 0 40px rgba(196,79,255,0.22), 0 0 70px rgba(0,229,255,0.06), inset 0 1px 0 rgba(196,79,255,0.12);
    }

    .tr-badge {
      display:flex; align-items:center; padding:0 18px;
      background:linear-gradient(135deg, rgba(196,79,255,0.14), rgba(0,229,255,0.07));
      border-right:1px solid var(--pdim);
      font-family:'IBM Plex Mono', monospace;
      font-size:0.7rem; letter-spacing:0.16em;
      color:var(--cyan); text-shadow:0 0 10px var(--cyan);
    }

    #wordInput {
      flex:1; border:none; outline:none;
      padding:18px 20px;
      font-family:'Exo 2', sans-serif; font-size:1.35rem; font-weight:600;
      color:var(--text); background:transparent; caret-color:var(--cyan);
    }
    #wordInput::placeholder { color:var(--muted); font-weight:300; font-style:italic; }

    #searchBtn {
      border:none;
      background:linear-gradient(135deg, rgba(0,229,255,0.34), rgba(125,220,255,0.44), rgba(56,201,255,0.30));
      color:#fff; padding:0 28px; cursor:pointer;
      font-family:'IBM Plex Mono', monospace;
      font-size:0.76rem; font-weight:700; letter-spacing:0.1em;
      transition:all .2s; white-space:nowrap;
      text-shadow:0 0 12px rgba(255,255,255,0.45), 0 0 10px var(--cyan);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 0 14px rgba(125,220,255,0.22), 0 0 26px rgba(0,229,255,0.12);
      position:relative; overflow:hidden;
      animation: search-pulse 3s ease-in-out infinite;
    }
    #searchBtn::after {
      content:'';
      position:absolute; inset:-40% auto -40% -55%;
      width:42%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transform:skewX(-18deg);
      animation: search-sheen 3.8s ease-in-out infinite;
      pointer-events:none;
    }
    #searchBtn:hover {
      background:linear-gradient(135deg, rgba(56,201,255,0.42), rgba(125,220,255,0.58), rgba(0,229,255,0.34));
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), 0 0 22px rgba(125,220,255,0.36), 0 0 38px rgba(0,229,255,0.20);
    }
    #searchBtn:disabled { background:rgba(80,60,110,0.4); cursor:not-allowed; text-shadow:none; animation:none; box-shadow:inset 0 1px 0 rgba(255,255,255,0.06); }
    @keyframes search-pulse {
      0%,100% { box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 0 14px rgba(125,220,255,0.22), 0 0 26px rgba(0,229,255,0.12); }
      50%      { box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), 0 0 22px rgba(125,220,255,0.36), 0 0 38px rgba(0,229,255,0.20); }
    }
    @keyframes search-sheen {
      0%,70% { left:-55%; opacity:0; }
      78%    { opacity:0.65; }
      100%   { left:120%; opacity:0; }
    }

    /* ─── RESULTS ─── */
    #results { margin-top:38px; }

    .r-animate { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* WORD HEADER */
    .word-header {
      padding:24px 26px; margin-bottom:28px;
      background:linear-gradient(135deg, rgba(196,79,255,0.07), rgba(0,229,255,0.03));
      border:1px solid var(--pdim); border-radius:10px;
      position:relative; overflow:hidden;
    }
    .word-header::before {
      content:''; position:absolute; left:0;top:0;bottom:0; width:4px;
      background:linear-gradient(180deg, var(--purple), var(--cyan), var(--pink));
      box-shadow:0 0 16px var(--purple);
    }

    .wh-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }

    .wh-word {
      font-family:'Orbitron', monospace; font-weight:900;
      font-size:clamp(1.8rem,5vw,2.8rem);
      background:linear-gradient(120deg, #fff 30%, var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter:drop-shadow(0 0 14px rgba(196,79,255,0.6));
    }

    .wh-type {
      font-family:'IBM Plex Mono', monospace; font-size:0.66rem;
      letter-spacing:0.16em; padding:5px 12px; border-radius:20px;
      border:1px solid var(--cyan); color:var(--cyan);
      text-shadow:0 0 8px var(--cyan); box-shadow:0 0 10px rgba(0,229,255,0.2);
    }

    .wh-kok {

function lowerTR(s){ return String(s).toLocaleLowerCase('tr-TR'); }

function chars(s){ return Array.from(String(s)); }
function safeInput(s){ return String(s).replace(/[<>`]/g,'').trim().slice(0,80); }

function lastLatinLetter(word){
  const list=chars(lowerTR(word));
  for(let i=list.length-1;i>=0;i--) if(/[a-zçğıöşüə]/i.test(list[i])) return list[i];
  return '';
}
function lastLatinVowel(word){
  const list=chars(lowerTR(word));

  if(v==='o'||v==='u') return 'u';
  if(v==='ö'||v==='ü') return 'ü';
  return 'ı';

function dOrT(word){ return VOICELESS.includes(lastLatinLetter(word))?'t':'d'; }
function cOrCh(word){ return VOICELESS.includes(lastLatinLetter(word))?'ç':'c'; }

function shortFa(v){ return String(v||'').split(/[\/،,؛;]/)[0].trim() || v; }
function shortEn(v){ return String(v||'').replace(/^(to|the|a|an)\s+/i,'').split(/[\/,;]/)[0].trim() || v; }
function enNP(v){ const x=shortEn(v); return /^(the|a|an|this|that|these|those|my|your|his|her|our|their)\b/i.test(x)?x:'the '+x; }
function isTurkishLike(w){ w=lowerTR(w); return /^[a-zçğıöşüâîûə]+$/i.test(w) && !/[qwx]/i.test(w) && /[aeıioöuüə]/i.test(w) && w.length>=2 && w.length<=32; }
function looksGarbage(w){ w=lowerTR(w).replace(/[^a-zçğıöşüə]/gi,''); return !w || /[qwx]/i.test(w) || (w.length>4 && !/[aeıioöuüə]/i.test(w)) || /(.)\1{3,}/.test(w); }
function fetchJSON(url,timeout=5200){
  const c=new AbortController(); const id=setTimeout(()=>c.abort(),timeout);
  return fetch(url,{signal:c.signal,cache:'no-store'}).then(r=>{ clearTimeout(id); if(!r.ok) throw new Error('network'); return r.json(); });
}
async function translateOnline(text,target){
  try{
    const data=await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=tr|${target}`,5000);
    const tr=cleanTranslation(data?.responseData?.translatedText || data?.matches?.[0]?.translation || '');
    return usefulTranslation(text,tr)?tr:'';
  }catch(_e){ return ''; }
}
async function wikiLookup(word){
  if(isArabicScript(word) || !isTurkishLike(word)) return {exists:false,pos:null};
  try{
    const url=`https://tr.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(word)}&format=json&origin=*`;
    const data=await fetchJSON(url,5000);
    const page=Object.values(data?.query?.pages||{})[0];
    if(!page || page.missing!==undefined) return {exists:false,pos:null};
    const ex=page.extract||'';
    const m=ex.match(/(?:^|\n)\s*(?:=+\s*)?(Ad|İsim|Fiil|Eylem|Sıfat|Zarf|Zamir|Edat|Bağlaç)(?:\s*=+)?\s*(?:\n|$)/i);
    let pos=null;
    if(m){ const h=lowerTR(m[1]); pos=(h==='ad'||h==='isim')?'isim':(h==='fiil'||h==='eylem')?'fiil':h; }
    return {exists:true,pos};
  }catch(_e){ return {exists:false,pos:null}; }
}
async function resolveWord(raw){
  const word=normalizeWord(raw);
  const stem=getVerbStem(word);
  const lex=LOCAL_LEXICON[cleanKey(word)] || LOCAL_LEXICON[cleanKey(stem)];
  if(lex){
    ONLINE_CACHE[cleanKey(word)]={tur:lex.tur,fa:lex.fa,en:lex.en};
    if(stem!==word) ONLINE_CACHE[cleanKey(stem)]={tur:lex.tur,fa:lex.fa,en:lex.en};
    return {word,stem,lex,wiki:{exists:true,pos:lex.tur},fa:lex.fa,en:lex.en,pos:lex.tur,hasMeaning:true};
  }
  const [fa,en,wiki]=await Promise.all([translateOnline(word,'fa'),translateOnline(word,'en'),wikiLookup(word)]);
  const finalFa=fa || '';
  const finalEn=en || '';
  const pos=detectVerb(word,lex)?'fiil':wiki.pos;
  if(finalFa || finalEn || pos || wiki.exists){
    ONLINE_CACHE[cleanKey(word)]={tur:pos||'unknown',fa:finalFa||`«${word}»`,en:finalEn||`“${word}”`};
    if(stem!==word) ONLINE_CACHE[cleanKey(stem)]={tur:pos||'unknown',fa:finalFa||`«${word}»`,en:finalEn||`“${word}”`};
  }
  return {word,stem,lex,wiki,fa:finalFa,en:finalEn,pos,hasMeaning:Boolean(finalFa||finalEn||wiki.exists)};
}

function detectVerb(raw){
  const key=cleanKey(raw);
  const endings=['mak','mek','maq','mək'];
  if(endings.some(e=>key.endsWith(e) && key.length>e.length)) return true;
  return LOCAL_LEXICON[key]?.tur==='fiil';
}
function getVerbStem(raw){
  const low=lowerTR(raw);
  for(const e of ['mak','mek','maq','mək']){
    if(low.endsWith(e) && chars(raw).length>e.length) return raw.slice(0,-e.length);
  }
  return raw;
}

function noteCaseFa(name,g){
  const m={
    Yalın:`حالت ساده و پایه است؛ وقتی ${g} نقش فاعل یا نام اصلی جمله را دارد از این شکل استفاده می‌شود.`,
    Belirtme:`حالت مفعولی مشخص است؛ در فارسی معمولاً با «را» ترجمه می‌شود و نشان می‌دهد ${g} مستقیماً اثر فعل را می‌گیرد.`,
    Yönelme:`حالت جهت و مقصد است؛ برای معنی «به» یا «برای» به کار می‌رود.`,
    Bulunma:`حالت مکانی است؛ نشان می‌دهد چیزی در، روی، یا نزد ${g} قرار دارد.`,
    Ayrılma:`حالت جدایی یا منبع است؛ برای معنی «از» و گاهی «درباره» استفاده می‌شود.`,
    Tamlayan:`حالت اضافی یا ملکی است؛ برای ساختن معنی «مالِ» یا «ـِ» فارسی به کار می‌رود.`
  };
  return m[name]||'';
}
function noteCaseEn(name,g){
  const m={
    Yalın:`The plain base form, used when ${enNP(g)} is the subject or the named item in the sentence.`,
    Belirtme:`The definite direct-object case. It marks ${enNP(g)} as the thing directly affected by the verb.`,
    Yönelme:`The direction or recipient case. It often means “to” or “for”.`,
    Bulunma:`The location case. It means “in”, “at”, or “on” ${enNP(g)}.`,
    Ayrılma:`The source or separation case. It often means “from” and can also mean “about”.`,
    Tamlayan:`The possession or relation case. It usually means “of” or “belonging to”.`
  };
  return m[name]||'';
}

function nounExample(id,form,gfa,gen){

    const b={Yalın:['Bebek uyuyor.','نوزاد خوابیده است.','The baby is sleeping.'],Belirtme:['Ben bebeği gördüm.','من نوزاد را دیدم.','I saw the baby.'],Yönelme:['Bebeğe süt verdim.','به نوزاد شیر دادم.','I gave milk to the baby.'],Bulunma:['Bebekte ateş var.','نوزاد تب دارد.','The baby has a fever.'],Ayrılma:['Bebekten bahsettik.','درباره نوزاد صحبت کردیم.','We talked about the baby.'],Tamlayan:['Bebeğin adı Deniz.','اسم نوزاد دنیز است.','The baby’s name is Deniz.']};
    return b[id]||b.Yalın;
  }
  const data={
    Yalın:[`${capTR(form)} burada.`,`${gfa} اینجاست.`,`${enNP(gen).replace(/^the /,'The ')} is here.`],
    Belirtme:[`Ben ${form} gördüm.`,`من ${gfa} را دیدم.`,`I saw ${enNP(gen)}.`],
    Yönelme:[`Ben ${form} baktım.`,`من به ${gfa} نگاه کردم.`,`I looked at ${enNP(gen)}.`],
    Bulunma:[`${capTR(form)} bir not var.`,`در ${gfa} یک یادداشت هست.`,`There is a note in or on ${enNP(gen)}.`],
    Ayrılma:[`${capTR(form)} bahsettik.`,`ما درباره یا از ${gfa} صحبت کردیم.`,`We talked about or from ${enNP(gen)}.`],
    Tamlayan:[`${capTR(form)} anlamı açık.`,`معنای ${gfa} روشن است.`,`The meaning of ${enNP(gen)} is clear.`]
  };
  return data[id]||data.Yalın;
}
function makeCase(hal,hal_fa,hal_en,form,gfa,gen){
  const ex=nounExample(hal,form,gfa,gen);
  return {hal,hal_fa,hal_en,form,note_fa:noteCaseFa(hal,gfa),note_en:noteCaseEn(hal,gen),ex_tr:ex[0],ex_fa:ex[1],ex_en:ex[2]};

function makePluralCase(hal,hal_fa,hal_en,form,gfa,gen){
  const key=hal.replace('Çoğul ','');

function makePoss(sahip,sahip_fa,sahip_en,form,gfa,gen){

}
function pastBase(stem){ const i=fourWay(stem), dt=dOrT(stem); return stem+dt+i; }
function personSetPast(base){
  const i=fourWay(base), a=twoWay(base);
  return [{s:'Ben',f:base+'m'},{s:'Sen',f:base+'n'},{s:'O',f:base},{s:'Biz',f:base+'k'},{s:'Siz',f:base+'n'+i+'z'},{s:'Onlar',f:base+'l'+a+'r'}];
}
function futureBase(stem){ const a=twoWay(stem); return attachVerbVowelSuffix(stem,a+'c'+a+'k','y'); }
function personSetFuture(base){
  const i=fourWay(base), a=twoWay(base), soft=base.replace(/k$/,'ğ');
  return [{s:'Ben',f:soft+i+'m'},{s:'Sen',f:base+'s'+i+'n'},{s:'O',f:base},{s:'Biz',f:soft+i+'z'},{s:'Siz',f:base+'s'+i+'n'+i+'z'},{s:'Onlar',f:base+'l'+a+'r'}];
}
function personSetImperative(stem){
  const i=fourWay(stem), a=twoWay(stem);
  return [
    {s:'Sen',f:stem},
    {s:'O (-sın)',f:stem+'s'+i+'n'},
    {s:'Biz (-elim)',f:attachVerbVowelSuffix(stem,a+'l'+i+'m','y')},
    {s:'Siz (-ın)',f:attachVerbVowelSuffix(stem,i+'n','y')},
    {s:'Onlar',f:stem+'s'+i+'n'+'l'+a+'r'}
  ];
}
function questionParticle(word){ const i=fourWay(word); return i==='ı'?'mı':i==='i'?'mi':i==='u'?'mu':'mü'; }

function buildVerbAnalysis(raw){
  const stem=getVerbStem(raw), lex=lookupLex(raw,stem), gfa=lex.fa, gen=lex.en, a=twoWay(stem), i=fourWay(stem);
  const mastar=stem+'m'+a+'k', neg=stem+'m'+a, aor=aoristBase(stem), pres=presentContinuous(stem), past=pastBase(stem), fut=futureBase(stem);
  const temel=[
    {ad:'Mastar',ad_fa:'مصدر',ad_en:'Infinitive',form:mastar,note_fa:'مصدر شکل پایه فعل است و در ترکی معمولاً با پسوند -mak یا -mek ساخته می‌شود.',note_en:'The infinitive is the basic verb form and is usually built with -mak or -mek.',ex_tr:`${capTR(mastar)} istiyorum.`,ex_fa:`می‌خواهم ${gfa} را انجام دهم.`,ex_en:`I want to ${gen}.`},
    {ad:'Olumsuz',ad_fa:'منفی',ad_en:'Negative',form:neg,note_fa:'برای منفی کردن ریشه فعل، پسوند -ma یا -me به ریشه اضافه می‌شود.',note_en:'The negative verb stem is built by adding -ma or -me to the root.',ex_tr:`Bugün ${neg} formunu öğreniyoruz.`,ex_fa:`امروز شکل منفی فعل ${gfa} را یاد می‌گیریم.`,ex_en:`Today we learn the negative form of ${gen}.`},
    {ad:'Soru',ad_fa:'سؤالی',ad_en:'Question',form:aor+' '+questionParticle(aor)+'?',note_fa:'برای سؤال ساختن، ذره پرسشی mı/mi/mu/mü بعد از شکل صرف‌شده می‌آید.',note_en:'To form a question, the particle mı/mi/mu/mü is placed after the conjugated form.',ex_tr:`O ${aor} ${questionParticle(aor)}?`,ex_fa:`آیا او این کار را انجام می‌دهد؟`,ex_en:'Does he or she do this action?'}
  ];
  const zamanlar=[
    {ad:'Geniş Zaman',ad_fa:'زمان حال اخباری / عادت',ad_en:'Aorist — Habitual Present',note_fa:'برای عادت‌های روزمره، حقایق کلی و کارهایی که معمولاً انجام می‌شوند استفاده می‌شود.',note_en:'Used for habits, general truths, and actions that usually happen.',ex_tr:`Ben her gün ${personSetAorist(aor)[0].f}.`,ex_fa:'من هر روز این کار را انجام می‌دهم.',ex_en:'I do this action every day.',sahislar:personSetAorist(aor)},
    {ad:'Şimdiki Zaman',ad_fa:'زمان حال در جریان',ad_en:'Present Continuous',note_fa:'برای کاری استفاده می‌شود که همین حالا یا در همین دوره در جریان است.',note_en:'Used for an action happening right now or around the present time.',ex_tr:`Ben şimdi ${personSetPresent(pres)[0].f}.`,ex_fa:'من اکنون در حال انجام این کار هستم.',ex_en:'I am doing this action now.',sahislar:personSetPresent(pres)},
    {ad:'Geçmiş Zaman (-di)',ad_fa:'زمان گذشته قطعی (شاهد عینی)',ad_en:'Definite Past (Witnessed)',note_fa:'برای کاری استفاده می‌شود که در گذشته اتفاق افتاده و گوینده آن را قطعی بیان می‌کند.',note_en:'Used for an event that happened in the past and is stated as definite.',ex_tr:`Dün ${personSetPast(past)[0].f}.`,ex_fa:'دیروز این کار را انجام دادم.',ex_en:'I did this action yesterday.',sahislar:personSetPast(past)},
    {ad:'Gelecek Zaman',ad_fa:'زمان آینده',ad_en:'Future Tense',note_fa:'برای کاری استفاده می‌شود که در آینده انجام خواهد شد.',note_en:'Used for an action that will happen in the future.',ex_tr:`Yarın ${personSetFuture(fut)[0].f}.`,ex_fa:'فردا این کار را انجام خواهم داد.',ex_en:'I will do this action tomorrow.',sahislar:personSetFuture(fut)},
    {ad:'Emir Kipi',ad_fa:'وجه امری / دستوری',ad_en:'Imperative Mood',note_fa:'برای دستور، درخواست یا پیشنهاد استفاده می‌شود؛ شکل دوم شخص مفرد معمولاً خود ریشه فعل است.',note_en:'Used for commands, requests, and suggestions; the second-person singular is usually the bare root.',ex_tr:`Lütfen ${personSetImperative(stem)[0].f}.`,ex_fa:'لطفاً این کار را انجام بده.',ex_en:'Please do this action.',sahislar:personSetImperative(stem)}
  ];
  const turevler=[
    makeDerivative(stem+'m'+a+'l'+i,`این ساخت معنی «باید ${gfa}» یا ضرورت انجام کار را می‌دهد.`,`This form expresses necessity: “must/should ${gen}”.`,`Bunu ${stem+'m'+a+'l'+i}.`,`باید این کار انجام شود.`,`This should be done.`),
    makeDerivative(stem+'m'+a+'k için',`این ساخت هدف را نشان می‌دهد: «برای ${gfa}».`,`This form expresses purpose: “in order to ${gen}”.`,`${capTR(stem+'m'+a+'k')} için zaman lazım.`,`برای ${gfa} زمان لازم است.`,`Time is needed in order to ${gen}.`)
  ];
  return {kelime:raw,tur:'fiil',anlam_fa:gfa,anlam_en:gen,kok:stem,sesUyumu:aType(stem),isimse:null,fiilse:{temel,zamanlar},turevler};
}

function buildLocalAnalysis(raw){
  if(isArabicScript(raw)) return buildArabicNounAnalysis(raw);
  return detectVerb(raw) ? buildVerbAnalysis(raw) : buildLatinNounAnalysis(raw);
}
async function buildSmartAnalysis(raw){
  const r=await resolveWord(raw);
  if(isArabicScript(r.word)){
    if(!r.hasMeaning && looksGarbage(r.word)) return translationOnly(r,'unknown');
    return buildArabicNounAnalysis(r.word);
  }
  if(!r.hasMeaning || looksGarbage(r.word)) return translationOnly(r,'invalid');
  if(r.pos==='fiil' || detectVerb(r.word,r.lex)) return buildVerbAnalysis(r.word);
  if(r.pos==='isim') return buildLatinNounAnalysis(r.word);
  if(NO_MORPH_POS.has(r.pos)) return translationOnly(r,'nomorph');
  if(r.wiki?.exists && isTurkishLike(r.word)) return buildLatinNounAnalysis(r.word);
  return translationOnly(r,'unknown');
}

async function analyze(){
  const w=safeInput(inp.value.trim()); if(!w) return;
  btn.disabled=true; btn.textContent='...';
  startLoad();
  res.innerHTML=`<div class="l-state"><div class="l-dots"><div class="l-dot"></div><div class="l-dot"></div><div class="l-dot"></div></div><div class="l-text">ANALYZING "${w.toUpperCase()}"…</div></div>`;

  try{
    await new Promise(resolve=>setTimeout(resolve,520));
    const parsed=await buildSmartAnalysis(w);
    doneLoad();
    render(parsed);
  }catch(err){
    doneLoad();
    res.innerHTML=`<div class="err-box">⚠️ خطا / Error: ${err.message}<br><small>لطفاً دوباره تلاش کنید / Please try again.</small></div>`;
  }
  btn.disabled=false; btn.textContent='SEARCH →';
}

// ─── RENDER ───
function render(d){
  const base=d.kok||d.kelime;
  let h=`<div class="r-animate">`;

  // WORD HEADER
  h+=`<div class="word-header">
    <div class="wh-top">
      <span class="wh-word">${d.kelime}</span>
      <span class="wh-type">${(d.tur||'').toUpperCase()}</span>
      ${d.kok?`<span class="wh-kok">kök: <em>${d.kok}</em>${d.sesUyumu?' · '+d.sesUyumu:''}</span>`:''}
    </div>
    <div class="wh-meaning fa shfa">${d.anlam_fa||''}</div>
    <div class="wh-meaning en shen">${d.anlam_en||''}</div>
  </div>`;

  if(d.onlyTranslate && (d.notice_fa || d.notice_en)){
    h+=`<div class="err-box" style="margin-bottom:24px">
      <span class="shfa">${d.notice_fa||''}</span>
      <span class="shen">${d.notice_en||''}</span>
    </div>`;
  }

  // ── NOUN ──
  if(d.isimse){
    const renderCases=(arr,tfa,ten)=>{
      if(!arr?.length) return '';
      return `<div class="sec">
        <div class="sec-title"><span class="shfa">${tfa}</span><span class="shen">${ten}</span></div>
        <div class="fgrid">
          ${arr.map(c=>`
            <div class="fcard">
              <div class="fc-lbl">
                <span class="shfa fc-lbl-fa">${c.hal_fa||c.sahip_fa||''}</span>
                <span class="shen fc-lbl-en">${c.hal_en||c.sahip_en||''}</span>
                <span class="fc-lbl-tr">${c.hal||c.sahip||''}</span>
              </div>
              <div class="fc-form">${hl(c.form,base)}</div>
              <div class="fc-note fa shfa">${c.note_fa||''}</div>
              <div class="fc-note en shen">${c.note_en||''}</div>
              <div class="fc-ex-tr">${c.ex_tr||''}</div>
              <div class="fc-ex-t fa shfa">${c.ex_fa||''}</div>
              <div class="fc-ex-t en shen">${c.ex_en||''}</div>
            </div>`).join('')}
        </div>
      </div>`;
    };
    h+=renderCases(d.isimse.tekil, 'حالت‌های مفرد (صرف اسم)', 'Singular Cases — Noun Declension');
    h+=renderCases(d.isimse.coul,  'حالت‌های جمع', 'Plural Cases');
    h+=renderCases(d.isimse.iyelik,'پسوندهای ملکی (صاحب)', 'Possessive Suffixes');
  }

  // ── VERB ──
  if(d.fiilse){
    const f=d.fiilse;
    if(f.temel?.length){
      h+=`<div class="sec">
        <div class="sec-title"><span class="shfa">فرم‌های پایه فعل</span><span class="shen">Base Verb Forms</span></div>
        <div class="fgrid">
          ${f.temel.map(t=>`
            <div class="fcard">
              <div class="fc-lbl">
                <span class="shfa fc-lbl-fa">${t.ad_fa}</span>
                <span class="shen fc-lbl-en">${t.ad_en}</span>
                <span class="fc-lbl-tr">${t.ad}</span>
              </div>
              <div class="fc-form">${hl(t.form,base)}</div>
              <div class="fc-note fa shfa">${t.note_fa}</div>
              <div class="fc-note en shen">${t.note_en}</div>
              <div class="fc-ex-tr">${t.ex_tr}</div>
              <div class="fc-ex-t fa shfa">${t.ex_fa}</div>
              <div class="fc-ex-t en shen">${t.ex_en}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }
    if(f.zamanlar?.length){
      h+=`<div class="sec">
        <div class="sec-title"><span class="shfa">زمان‌ها و صرف فعل</span><span class="shen">Tenses & Conjugation</span></div>
        ${f.zamanlar.map(z=>`
          <div class="tblock">
            <div class="tb-head">
              <div>
                <div class="tb-name">${z.ad}</div>
                <div class="tb-sub fa shfa">${z.ad_fa}</div>
                <div class="tb-sub en shen">${z.ad_en}</div>
              </div>
              <div>
                <div class="tb-note fa shfa">${z.note_fa}</div>
                <div class="tb-note en shen">${z.note_en}</div>
              </div>
            </div>
            <div class="ctable">
              ${(z.sahislar||[]).map(s=>`
                <div class="ccell">
                  <div class="cc-p">${s.s}</div>
                  <div class="cc-f">${hl(s.f,base)}</div>
                </div>`).join('')}
            </div>
            <div class="tb-ex">
              <div class="tb-ex-tr">${z.ex_tr||''}</div>
              <div class="tb-ex-t fa shfa">${z.ex_fa||''}</div>
              <div class="tb-ex-t en shen">${z.ex_en||''}</div>
            </div>
          </div>`).join('')}
      </div>`;
    }
  }

  // ── DERIVATIVES ──
  if(d.turevler?.length){
    h+=`<div class="sec">
      <div class="sec-title"><span class="shfa">مشتقات و ساختارهای مرتبط</span><span class="shen">Derivatives & Related Forms</span></div>
      <div class="fgrid">
        ${d.turevler.map(t=>`
          <div class="fcard">
            <div class="fc-form" style="margin-bottom:8px">${hl(t.form,base)}</div>
            <div class="fc-note fa shfa">${t.note_fa}</div>
            <div class="fc-note en shen">${t.note_en}</div>
            <div class="fc-ex-tr">${t.ex_tr||''}</div>
            <div class="fc-ex-t fa shfa">${t.ex_fa||''}</div>
            <div class="fc-ex-t en shen">${t.ex_en||''}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  h+=`</div>`;
  res.innerHTML=h;
  res.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
